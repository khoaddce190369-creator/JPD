<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPD123 Midterm Ready</title>
  <style>
    :root{
      --bg:#f8fafc;
      --panel:#ffffff;
      --line:#e5e7eb;
      --text:#0f172a;
      --muted:#64748b;
      --brand:#0ea5e9;
      --brand-2:#0284c7;
      --soft:#eff6ff;
      --good:#15803d;
      --warn:#b45309;
      --bad:#b91c1c;
      --pink:#fff5f5;
      --shadow:0 10px 30px rgba(15,23,42,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#f8fbff 0%,#f8fafc 100%);
    }
    .app{
      display:grid;
      grid-template-columns:320px 1fr;
      min-height:100vh;
    }
    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      background:#fff;
      border-right:1px solid var(--line);
      padding:18px;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:18px;
    }
    .brand-badge{
      width:44px;height:44px;border-radius:14px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      color:#fff;font-weight:800;font-size:22px;
      box-shadow:var(--shadow);
    }
    .brand h1{margin:0;font-size:20px}
    .brand small{color:var(--muted)}
    .section-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted);
      margin:16px 0 8px;
      font-weight:800;
    }
    .nav-btn{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:12px 14px;
      cursor:pointer;
      margin-bottom:8px;
      transition:.18s ease;
      color:var(--text);
    }
    .nav-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    .nav-btn.active{
      border-color:#bae6fd;
      background:var(--soft);
    }
    .nav-sub{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }
    .progress-box{
      margin-top:18px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:14px;
    }
    .progress-bar{
      width:100%;
      height:10px;
      border-radius:999px;
      background:#e2e8f0;
      overflow:hidden;
    }
    #progressFill{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--brand),#22c55e);
      transition:.25s ease;
    }

    .main{padding:24px}
    .page{
      max-width:1200px;
      margin:0 auto;
      display:grid;
      gap:18px;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }
    .hero{
      display:grid;
      grid-template-columns:1.4fr .9fr;
      gap:18px;
    }
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .lesson-head,.section-head{
      display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;
    }
    h2,h3,h4{margin:0}
    p{margin:0}
    .muted,.tiny{color:var(--muted)}
    .tiny{font-size:12px}
    .tag,.pill,.chip{
      display:inline-flex;align-items:center;gap:6px;
      border:1px solid #bae6fd;
      background:var(--soft);
      color:#075985;
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:700;
    }
    .pill-row,.chips,.btn-row{
      display:flex;flex-wrap:wrap;gap:8px;
    }
    .btn{
      border:none;
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      color:#fff;
      border-radius:14px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:800;
    }
    .btn.secondary{
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
    }
    .btn.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
    .btn.good{background:linear-gradient(135deg,#22c55e,#15803d)}
    .callout{
      border:1px solid #dbeafe;
      background:#f8fbff;
      border-radius:16px;
      padding:14px;
    }
    .reading{
      padding:16px;
      border-radius:16px;
      background:#fafafa;
      border:1px solid var(--line);
      font-size:18px;
      line-height:1.9;
      color:#111;
    }
    .grammar-card,.kanji-item,.plan-day,.speaking-box,.q-block{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:14px;
    }
    .grammar-card{margin-top:10px}
    .k-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .kanji-word{font-size:24px;font-weight:800}
    .choice{
      display:block;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      margin-top:8px;
      cursor:pointer;
    }
    .choice:hover{background:#fafcff}
    .choice input{margin-right:8px}
    .score-box{
      padding:12px 14px;
      border-radius:14px;
      background:#f0fdf4;
      border:1px solid #bbf7d0;
      margin-top:12px;
    }
    .score-box.bad{
      background:#fef2f2;
      border-color:#fca5a5;
    }
    .ok{color:var(--good)}
    .danger-text{color:var(--bad)}
    .warn-text{color:var(--warn)}
    .timer{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #fecaca;
      background:#fff5f5;
      font-weight:800;
      color:#991b1b;
      min-width:92px;
      text-align:center;
    }
    .jp{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
    code{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:10px;
      padding:2px 8px;
      font-size:13px;
    }
    .empty-note{
      padding:16px;border-radius:16px;background:#fafafa;border:1px dashed #cbd5e1;color:#475569;
    }
    @media (max-width:1100px){
      .app{grid-template-columns:1fr}
      .sidebar{
        position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)
      }
      .hero,.grid-2,.grid-3,.grid-4,.k-grid{grid-template-columns:1fr}
    }
  </style>
</head>

  </div>

    function deepClone(obj){
      return JSON.parse(JSON.stringify(obj));
    }

    function pickFromPool(pool, start, count){
      const out = [];
      for(let i=0;i<count;i++){
        out.push(deepClone(pool[(start + i) % pool.length]));
      }
      return out;
    }

    function buildMidtermExam(seed){
      return [
        ...pickFromPool(MIDTERM_POOLS.vocab, seed, 4),
        ...pickFromPool(MIDTERM_POOLS.kanjiRead, seed*2, 2),
        ...pickFromPool(MIDTERM_POOLS.kanjiWrite, seed*3, 2),
        ...pickFromPool(MIDTERM_POOLS.grammar, seed*4, 7)
      ];
    }

    }));

    function buildMCQAbcd(containerId, questions, scoreKey, titleText="Bài tập thực hành"){
      const wrap = document.getElementById(containerId);
      if(!wrap) return;
      const letters = ["A","B","C","D"];

      wrap.innerHTML = `
        <div class="section-head">
          <h3 style="font-size:18px;margin:0">${titleText}</h3>
          <button class="btn warn" id="${containerId}-submit">Nộp bài</button>
        </div>
        ${questions.map((q,qi)=>`
          <div class="q-block">
            <div><strong>Câu ${qi+1}.</strong> <span class="jp">${q.q}</span></div>
            ${q.choices.map((choice,ci)=>`
              <label class="choice">
                <input type="radio" name="${containerId}-q${qi}" value="${ci}">
                <span class="tiny" style="display:inline-block;width:22px;font-weight:800">${letters[ci]}.</span>
                <span class="jp">${choice}</span>
              </label>
            `).join("")}
          </div>
        `).join("")}
        <div id="${containerId}-result"></div>
      `;

      document.getElementById(`${containerId}-submit`).onclick = ()=>{
        let score = 0;
        const review = [];

        questions.forEach((q,qi)=>{
          const chosen = document.querySelector(`input[name="${containerId}-q${qi}"]:checked`);
          const val = chosen ? Number(chosen.value) : -1;
          if(val === q.answer) score++;
          review.push(`
            <div class="q-block">
              <div><strong>Câu ${qi+1}:</strong> ${val === q.answer ? `<span class="ok">Đúng</span>` : `<span class="danger-text">Sai</span>`}</div>
              <div class="tiny">Đáp án đúng: <strong>${letters[q.answer]}</strong>. <span class="jp">${q.choices[q.answer]}</span></div>
              <div class="tiny jp">${q.explain || ""}</div>
            </div>
          `);
        });

        saveScore(scoreKey, score, questions.length);
        const pct = Math.round((score/questions.length)*100);
        const answerKey = questions.map((q,i)=>`${i+1}.${letters[q.answer]}`).join(" ／ ");

        document.getElementById(`${containerId}-result`).innerHTML = `
          <div class="score-box ${pct < 60 ? 'bad' : ''}">
            <strong>Kết quả: ${score}/${questions.length} (${pct}%)</strong>
            <div class="tiny" style="margin-top:6px">
              ${pct >= 80 ? "Rất sát form giữa kỳ." : pct >= 60 ? "Ổn, nhưng nên làm lại thêm 1 vòng." : "Nên ôn lại phần sai rồi làm lại."}
            </div>
          </div>
          <div class="callout" style="margin-top:12px">
            <strong>Answer key:</strong> <span class="jp">${answerKey}</span>
          </div>
          <div style="margin-top:12px">${review.join("")}</div>
        `;
      };
    }

        }
        if(examTimeLeft <= 0){
          clearInterval(examTimer);
          submitExam();
        }
      },1000);

      document.getElementById("submitExamBtn").onclick = submitExam;
      document.getElementById("cancelExamBtn").onclick = renderExamHome;
    }

    function submitExam(){
      clearInterval(examTimer);
      if(!currentExam) return;
      const letters = ["A","B","C","D"];
      let score = 0;

      const review = currentExam.map((q,qi)=>{
        const chosen = document.querySelector(`input[name="exam-q${qi}"]:checked`);
        const val = chosen ? Number(chosen.value) : -1;
        if(val === q.answer) score++;
        return `
          <div class="q-block">
            <div><strong>Câu ${qi+1}:</strong> ${val === q.answer ? `<span class="ok">Đúng</span>` : `<span class="danger-text">Sai</span>`}</div>
            <div class="tiny">Đáp án đúng: <strong>${letters[q.answer]}</strong>. <span class="jp">${q.choices[q.answer]}</span></div>
          </div>
        `;
      }).join("");

      const pct = Math.round((score/currentExam.length)*100);
      const answerKey = currentExam.map((q,i)=>`${i+1}.${letters[q.answer]}`).join(" ／ ");
      saveScore("mock-random", score, currentExam.length);

      document.getElementById("examResult").innerHTML = `
        <div class="score-box ${pct < 60 ? 'bad' : ''}">
          <strong>Kết quả simulator: ${score}/${currentExam.length} (${pct}%)</strong>
          <div class="tiny" style="margin-top:6px">
            ${pct >= 80 ? "Đã khá sát midterm thật." : pct >= 60 ? "Ổn, nên làm thêm vài đề nữa." : "Nên quay lại lesson 4–5 để rà lỗi."}
          </div>
        </div>
        <div class="callout" style="margin-top:12px">
          <strong>Answer key:</strong> <span class="jp">${answerKey}</span>
        </div>
        <div style="margin-top:12px">${review}</div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" onclick="startExam()">Làm đề mới</button>
          <button class="btn secondary" onclick="renderView('midterm')">Qua hub midterm</button>
        </div>
      `;
    }

    function renderMidtermHub(){
      clearInterval(examTimer);
      clearInterval(midtermTimer);
      setActiveNav("midterm");
      const main = document.getElementById("main");

      main.innerHTML = `
        <div class="page">
          <section class="card">
            <div class="lesson-head">
              <div>
                <div class="tag">Midterm focus • Bài 4–5</div>
                <h2>Ôn thi midterm</h2>
                <p class="muted">
                  10 đề dưới đây đều giữ đúng form 15 câu:
                  <strong>4 từ vựng • 4 kanji • 7 ngữ pháp</strong>.
                </p>
              </div>
              <div class="pill-row">
                <span class="pill">10 đề</span>
                <span class="pill">15 câu / đề</span>
                <span class="pill">ABCD</span>
              </div>
            </div>
            <div class="callout" style="margin-top:14px">
              <strong>Cấu trúc từng đề:</strong> 1–4 語彙 / 5–8 漢字 / 9–15 文法
            </div>
          </section>

          <section class="grid-2">
            ${MIDTERM_EXAMS.map(exam=>`
              <div class="card">
                <div class="tag">Midterm ${String(exam.id).padStart(2,"0")}</div>
                <h3 style="margin:10px 0 6px">${exam.title}</h3>
                <div class="tiny">4 語彙 • 4 漢字 • 7 文法</div>
                <div style="margin-top:10px">${scoreLabel(`midterm-${exam.id}`)}</div>
                <div class="btn-row" style="margin-top:12px">
                  <button class="btn" onclick="startMidtermExam(${exam.id})">Làm đề này</button>
                </div>
              </div>
            `).join("")}
          </section>
        </div>
      `;
    }

    function startMidtermExam(id){
      clearInterval(midtermTimer);
      currentMidtermExam = MIDTERM_EXAMS.find(x=>x.id === id);
      if(!currentMidtermExam) return;

      const letters = ["A","B","C","D"];
      midtermTimeLeft = 15 * 60;

      const main = document.getElementById("main");
      main.innerHTML = `
        <div class="page">
          <section class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
            <div>
              <div class="tag">Đang làm ${currentMidtermExam.title}</div>
              <h2 style="margin-top:8px">${currentMidtermExam.title} • 15 câu midterm</h2>
              <div class="tiny">1–4 語彙 / 5–8 漢字 / 9–15 文法</div>
            </div>
            <div class="timer" id="midtermTimer">15:00</div>
          </section>

          <section class="card">
            ${currentMidtermExam.questions.map((q,qi)=>`
              <div class="q-block">
                <div><strong>Câu ${qi+1}.</strong> <span class="jp">${q.q}</span></div>
                ${q.choices.map((choice,ci)=>`
                  <label class="choice">
                    <input type="radio" name="midterm-q${qi}" value="${ci}">
                    <span class="tiny" style="display:inline-block;width:22px;font-weight:800">${letters[ci]}.</span>
                    <span class="jp">${choice}</span>
                  </label>
                `).join("")}
              </div>
            `).join("")}

            <div class="btn-row">
              <button class="btn warn" id="submitMidtermBtn">Nộp đề</button>
              <button class="btn secondary" id="cancelMidtermBtn">Về hub</button>
            </div>
            <div id="midtermExamResult"></div>
          </section>
        </div>
      `;

      midtermTimer = setInterval(()=>{
        midtermTimeLeft--;
        const el = document.getElementById("midtermTimer");
        if(el){
          const m = String(Math.floor(midtermTimeLeft/60)).padStart(2,"0");
          const s = String(midtermTimeLeft%60).padStart(2,"0");
          el.textContent = `${m}:${s}`;
        }
        if(midtermTimeLeft <= 0){
          clearInterval(midtermTimer);
          submitMidtermExam();
        }
      },1000);

      document.getElementById("submitMidtermBtn").onclick = submitMidtermExam;
      document.getElementById("cancelMidtermBtn").onclick = renderMidtermHub;
    }

    function submitMidtermExam(){
      clearInterval(midtermTimer);
      if(!currentMidtermExam) return;
      const letters = ["A","B","C","D"];
      let score = 0;

      const review = currentMidtermExam.questions.map((q,qi)=>{
        const chosen = document.querySelector(`input[name="midterm-q${qi}"]:checked`);
        const val = chosen ? Number(chosen.value) : -1;
        if(val === q.answer) score++;
        return `
          <div class="q-block">
            <div><strong>Câu ${qi+1}:</strong> ${val === q.answer ? `<span class="ok">Đúng</span>` : `<span class="danger-text">Sai</span>`}</div>
            <div class="tiny">Đáp án đúng: <strong>${letters[q.answer]}</strong>. <span class="jp">${q.choices[q.answer]}</span></div>
          </div>
        `;
      }).join("");

      const pct = Math.round((score/currentMidtermExam.questions.length)*100);
      const answerKey = currentMidtermExam.questions.map((q,i)=>`${i+1}.${letters[q.answer]}`).join(" ／ ");
      saveScore(`midterm-${currentMidtermExam.id}`, score, currentMidtermExam.questions.length);

      document.getElementById("midtermExamResult").innerHTML = `
        <div class="score-box ${pct < 60 ? 'bad' : ''}">
          <strong>Kết quả ${currentMidtermExam.title}: ${score}/${currentMidtermExam.questions.length} (${pct}%)</strong>
          <div class="tiny" style="margin-top:6px">
            ${pct >= 80 ? "Rất sát form midterm." : pct >= 60 ? "Ổn, nhưng nên làm thêm đề khác." : "Nên quay lại ôn Lesson 4–5 rồi làm lại."}
          </div>
        </div>
        <div class="callout" style="margin-top:12px">
          <strong>Answer key sau câu 15:</strong> <span class="jp">${answerKey}</span>
        </div>
        <div style="margin-top:12px">${review}</div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" onclick="renderMidtermHub()">Làm đề khác</button>
          <button class="btn secondary" onclick="renderView('exam')">Qua simulator</button>
        </div>
      `;
    }

    function renderLesson(id){
      clearInterval(examTimer);
      clearInterval(midtermTimer);
      const lesson = LESSONS.find(l=>l.id === id);
      if(!lesson) return;
      setActiveNav(`lesson-${id}`);
      const main = document.getElementById("main");

      if([4,5].includes(id)){
        const bank = MIDTERM_LESSON_BANK[id];
        main.innerHTML = `
          <div class="page">
            <section class="card">
              <div class="lesson-head">
                <div>
                  <div class="tag">Lesson ${id} • Midterm focus</div>
                  <h2 style="margin-top:8px">${lesson.title}</h2>
                  <p class="muted">${lesson.vnTitle}</p>
                  <div class="pill-row" style="margin-top:12px">
                    <span class="pill">${lesson.days}</span>
                    <span class="pill">Quiz bám form midterm</span>
                    <span class="pill">Vocab / Kanji / Grammar</span>
                  </div>
                </div>
                <div class="btn-row">
                  <button class="btn good" onclick="markLessonDone(${id})">Đánh dấu đã ôn</button>
                  <button class="btn secondary" onclick="renderView('midterm')">Qua hub midterm</button>
                </div>
              </div>
              <div class="callout" style="margin-top:14px">
                <strong>Mục tiêu:</strong> ${lesson.objective}
              </div>
            </section>

            <section class="grid-2">
              <div class="card">
                <div class="section-head"><h3>Từ vựng trọng điểm</h3></div>
                <div class="chips" style="margin-top:10px">
                  ${bank.focusVocab.map(v=>`<span class="chip jp">${v}</span>`).join("")}
                </div>
              </div>
              <div class="card">
                <div class="section-head"><h3>Reading mini</h3></div>
                <div class="reading jp" style="margin-top:10px">${lesson.reading}</div>
              </div>
            </section>

            <section class="card">
              <div class="section-head"><h3>Ngữ pháp trọng điểm</h3></div>
              ${lesson.grammar.map(g=>`
                <div class="grammar-card">
                  <div><code>${g.pattern}</code></div>
                  <div class="tiny" style="margin-top:8px">${g.use}</div>
                  <div class="jp" style="margin-top:8px">${g.example}</div>
                </div>
              `).join("")}
            </section>

            <section class="card">
              <div class="section-head"><h3>Kanji trọng điểm</h3></div>
              <div class="k-grid" style="margin-top:12px">
                ${lesson.kanji.map(k=>`
                  <div class="kanji-item">
                    <div class="kanji-word jp">${k.word}</div>
                    <div class="tiny jp" style="margin-top:6px">${k.reading}</div>
                    <div class="tiny" style="margin-top:6px">${k.meaning}</div>
                  </div>
                `).join("")}
              </div>
            </section>

            <section class="card"><div id="lesson-${id}-vocab-midterm"></div></section>
            <section class="card"><div id="lesson-${id}-kanji-midterm"></div></section>
            <section class="card"><div id="lesson-${id}-grammar-midterm"></div></section>
          </div>
        `;

        buildMCQAbcd(`lesson-${id}-vocab-midterm`, bank.vocab, `lesson-${id}-vocab-score`, "Quiz từ vựng • form midterm");
        buildMCQAbcd(`lesson-${id}-kanji-midterm`, bank.kanji, `lesson-${id}-kanji-score`, "Quiz kanji • form midterm");
        buildMCQAbcd(`lesson-${id}-grammar-midterm`, bank.grammar, `lesson-${id}-grammar-score`, "Quiz ngữ pháp • form midterm");
        return;
      }

      main.innerHTML = `
        <div class="page">
          <section class="card">
            <div class="lesson-head">
              <div>
                <div class="tag">Lesson ${lesson.id}</div>
                <h2 style="margin-top:8px">${lesson.title}</h2>
                <p class="muted">${lesson.vnTitle}</p>
                <div class="pill-row" style="margin-top:12px">
                  <span class="pill">${lesson.days}</span>
                  <span class="pill">${state.doneLessons.includes(id) ? "Đã ôn" : "Chưa đánh dấu"}</span>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn good" onclick="markLessonDone(${id})">Đánh dấu đã ôn</button>
              </div>
            </div>
            <div class="callout" style="margin-top:14px">
              <strong>Mục tiêu:</strong> ${lesson.objective}
            </div>
          </section>

          <section class="grid-2">
            <div class="card">
              <div class="section-head"><h3>Reading mini</h3></div>
              <div class="reading jp" style="margin-top:10px">${lesson.reading}</div>
            </div>
            <div class="card">
              <div class="section-head"><h3>Gợi ý</h3></div>
              <div class="empty-note" style="margin-top:10px">
                Bài này giữ vai trò nền để hỗ trợ Bài 4–5. Tập trung chính vẫn là lesson 4 và 5 khi ôn midterm.
              </div>
            </div>
          </section>

          <section class="card">
            <div class="section-head"><h3>Ngữ pháp</h3></div>
            ${lesson.grammar.map(g=>`
              <div class="grammar-card">
                <div><code>${g.pattern}</code></div>
                <div class="tiny" style="margin-top:8px">${g.use}</div>
                <div class="jp" style="margin-top:8px">${g.example}</div>
              </div>
            `).join("")}
          </section>

          <section class="card">
            <div class="section-head"><h3>Kanji</h3></div>
            <div class="k-grid" style="margin-top:12px">
              ${lesson.kanji.map(k=>`
                <div class="kanji-item">
                  <div class="kanji-word jp">${k.word}</div>
                  <div class="tiny jp" style="margin-top:6px">${k.reading}</div>
                  <div class="tiny" style="margin-top:6px">${k.meaning}</div>
                </div>
              `).join("")}
            </div>
          </section>
        </div>
      `;
    }

    function renderView(view){
      if(view === "home") return renderHome();
      if(view === "roadmap") return renderRoadmap();
      if(view === "speaking") return renderSpeaking();
      if(view === "exam") return renderExamHome();
      if(view === "midterm") return renderMidtermHub();
      renderHome();
    }

    initNav();
    renderProgress();
    renderHome();
  </script>
</body>
</html>
