<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPD123 - 30 ngày 8+ toàn môn & 8.5+ speaking</title>
  <style>
    :root{
      --bg:#f7f7f8;
      --panel:#ffffff;
      --line:#e5e7eb;
      --text:#111111;
      --muted:#555555;
      --accent:#dc2626;
      --accent-2:#ef4444;
      --shadow:0 10px 28px rgba(0,0,0,.06);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:var(--bg);color:var(--text);
      font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
    }
    button,input,select,textarea{font:inherit}
    .jp{font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif}
    .app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
    .sidebar{
      border-right:1px solid var(--line);
      background:#fff;
      position:sticky;top:0;align-self:start;height:100vh;
      padding:22px 18px 28px;overflow:auto
    }
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .brand-badge{
      width:48px;height:48px;border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;
      box-shadow:var(--shadow)
    }
    .brand h1{font-size:18px;line-height:1.2;margin:0}
    .brand small{color:var(--muted)}
    .section-title{
      margin:18px 8px 8px;
      font-size:12px;letter-spacing:.12em;text-transform:uppercase;
      color:#991b1b;font-weight:800
    }
    .nav-btn{
      width:100%;background:#fff;color:var(--text);border:1px solid transparent;
      border-radius:14px;padding:12px 14px;text-align:left;margin:4px 0;
      cursor:pointer;transition:.2s ease
    }
    .nav-btn:hover{background:#fef2f2;border-color:#fecaca}
    .nav-btn.active{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
    .nav-sub{font-size:13px;color:var(--muted);margin-top:4px}
    .progress-box{margin-top:18px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
    .progress-bar{height:10px;border-radius:999px;background:#f1f5f9;overflow:hidden;border:1px solid var(--line)}
    .progress-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:.3s ease}
    .main{padding:28px}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:20px}
    .card{
      background:#fff;border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:20px
    }
    .page{display:flex;flex-direction:column;gap:18px}
    .hero h2,.page h2,.lesson-head h2{margin:0 0 8px;font-size:28px;line-height:1.2}
    .muted{color:var(--muted)}
    .tiny{font-size:13px;color:var(--muted)}
    .pill-row,.chips,.btn-row{display:flex;flex-wrap:wrap;gap:8px}
    .pill,.chip{
      display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;
      border:1px solid var(--line);background:#fafafa;color:#111;font-size:13px;font-weight:600
    }
    .btn-row{margin-top:12px;gap:10px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .mini-stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .mini-stat strong{display:block;font-size:22px}
    .btn{
      border:none;cursor:pointer;padding:11px 15px;border-radius:13px;
      background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-weight:800;
      transition:transform .12s ease,opacity .2s ease
    }
    .btn:hover{transform:translateY(-1px)}
    .btn.secondary{background:#fff;color:#b91c1c;border:1px solid #fca5a5}
    .btn.good{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
    .btn.warn{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
    .lesson-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
    .tag{
      display:inline-flex;align-items:center;
      font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      color:#b91c1c;border:1px solid #fecaca;padding:7px 10px;border-radius:999px;background:#fff5f5
    }
    table{
      width:100%;border-collapse:collapse;overflow:hidden;border-radius:16px;
      border:1px solid var(--line);background:#fff
    }
    th,td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    th{background:#fafafa;text-align:left;color:#111}
    tr:last-child td{border-bottom:none}
    .section-head{
      display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px
    }
    .section-head h3{margin:0;font-size:21px}
    .note,.callout{
      padding:14px 16px;border-left:4px solid var(--accent);
      background:#fff5f5;border-radius:14px;color:#111
    }
    .callout{border-left:none;border:1px solid #fecaca}
    .grammar-card{
      border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;margin-bottom:12px
    }
    .grammar-card code{
      background:#fff5f5;border:1px solid #fecaca;border-radius:8px;padding:2px 8px;color:#b91c1c
    }
    .k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .kanji-item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
    .kanji-word{font-size:24px;font-weight:800}
    .quiz-wrap{
      border:1px solid #fecaca;border-radius:18px;background:#fff;padding:16px;margin-top:14px
    }
    .q-block{
      border:1px solid var(--line);background:#fafafa;padding:14px;border-radius:14px;margin-bottom:12px
    }
    .q-block:last-child{margin-bottom:0}
    .choice{
      display:block;padding:9px 11px;border-radius:12px;border:1px solid var(--line);
      background:#fff;margin-top:8px;cursor:pointer
    }
    .choice input{margin-right:8px}
    .score-box{
      padding:12px 14px;border-radius:14px;background:#fff5f5;border:1px solid #fecaca;margin-top:12px
    }
    .score-box.bad{background:#fef2f2;border-color:#fca5a5}
    .plan-day{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px}
    .plan-day h4{margin:0 0 8px}
    .plan-day ul{margin:0;padding-left:18px}
    .speaking-box{
      border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin-bottom:12px
    }
    .reading{
      padding:16px;border-radius:16px;background:#fafafa;border:1px solid var(--line);
      font-size:18px;line-height:1.9;color:#111
    }
    .ok{color:#15803d}.warn-text{color:#b45309}.danger-text{color:#b91c1c}
    .timer{
      padding:10px 14px;border-radius:12px;border:1px solid #fecaca;background:#fff5f5;
      font-weight:800;color:#991b1b
    }
    @media (max-width:1100px){
      .app{grid-template-columns:1fr}
      .sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}
      .hero,.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge">日</div>
        <div>
          <h1>JPD123 30 ngày</h1>
          <small>8+ toàn môn • 8.5+ speaking</small>
        </div>
      </div>

      <div class="section-title">Điều hướng</div>
      <button class="nav-btn" data-view="home">🏠 Tổng quan<div class="nav-sub">Mục tiêu, cách dùng web</div></button>
      <button class="nav-btn" data-view="roadmap">🗓️ Lộ trình 30 ngày<div class="nav-sub">Học gì từng ngày</div></button>
      <button class="nav-btn" data-view="speaking">🗣️ Speaking 8.5+<div class="nav-sub">Reading, shadowing, Q&A</div></button>
      <button class="nav-btn" data-view="exam">🧪 Mock test<div class="nav-sub">Tổng hợp vocab / grammar / kanji</div></button>

      <div class="section-title">7 bài</div>
      <div id="lessonNav"></div>

      <div class="progress-box">
        <div class="tiny" style="margin-bottom:8px">Tiến độ cá nhân</div>
        <div class="progress-bar"><div id="progressFill"></div></div>
        <div id="progressText" class="tiny" style="margin-top:8px">0% hoàn thành</div>
        <div class="btn-row">
          <button class="btn secondary" id="resetProgressBtn">Reset tiến độ</button>
        </div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <script>
    const LESSONS = [
      {
        id: 1,
        title: "Bài 1 - はじめまして",

        katakana: [

          { word: "百円", reading: "ひゃくえん", meaning: "100 yên" },

          { word: "八月", reading: "はちがつ", meaning: "tháng 8" },

        reading: "きょう、スーパーへ行きました。レジの近くでTシャツを見ました。あのTシャツはきれいでした。店員さんに『これはいくらですか』と聞きました。三千円でした。それからレストランでカレーとスープを注文しました。コーヒーも飲みました。",

          { q: "これは何の料理ですか。", a: "豚肉の料理です。" }

      {

        reading: "わたしは毎日六時に起きます。午前七時に朝ご飯を食べます。八時から授業があります。午後、図書館で日本語を勉強します。日曜日は公園へ行きます。ときどきアルバイトもします。ホームステイの友だちとバーベキューをすることもあります。",

      },
      {
        id: 4,

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }
    function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }

    function uniqueChoices(correct, pool, count = 4) {
      const filtered = [...new Set(pool.filter(x => x && x !== correct))];
      return shuffle([correct, ...sample(filtered, count - 1)]);
    }

    function getVocabQuizCount(vocabLength) {
      return Math.min(30, Math.max(20, Math.ceil(vocabLength * 0.45)));
    }

    function makeVocabQuestions(lesson) {
      const vocab = lesson.vocab.filter(v => v.jp && v.vi);
      const count = getVocabQuizCount(vocab.length);
      const meaningPool = vocab.map(v => v.vi).filter(Boolean);
      const jpPool = vocab.map(v => v.jp).filter(Boolean);
      const readingPool = vocab.map(v => v.reading).filter(Boolean);
      const questions = [];
      const shuffled = shuffle(vocab);

      for (let i = 0; i < count; i++) {
        const item = shuffled[i % shuffled.length];
        const type = i % 4;

        if (type === 0) {
          const choices = uniqueChoices(item.vi, meaningPool, 4);
          questions.push({
            q: `Nghĩa của từ "${item.jp}" là gì?`,
            choices,
            answer: choices.indexOf(item.vi),
            explain: item.reading ? `Cách đọc: ${item.reading}` : ""
          });
          continue;
        }
        if (type === 1) {
          const choices = uniqueChoices(item.jp, jpPool, 4);
          questions.push({
            q: `Từ tiếng Nhật nào có nghĩa "${item.vi}"?`,
            choices,
            answer: choices.indexOf(item.jp),
            explain: item.reading ? `Cách đọc: ${item.reading}` : ""
          });
          continue;
        }
        if (type === 2 && item.reading) {
          const choices = uniqueChoices(item.reading, readingPool, 4);
          questions.push({
            q: `Cách đọc của "${item.jp}" là gì?`,
            choices,
            answer: choices.indexOf(item.reading),
            explain: `Nghĩa: ${item.vi}`
          });
          continue;
        }
        const choices = uniqueChoices(item.vi, meaningPool.filter(x => x !== item.vi), 4);
        questions.push({
          q: `Chọn nghĩa đúng nhất cho "${item.jp}"`,
          choices,
          answer: choices.indexOf(item.vi),
          explain: item.reading ? `Cách đọc: ${item.reading}` : ""
        });
      }
      return shuffle(questions);
    }

    function makeKanjiQuestions(lesson) {
      const pool = lesson.kanji || [];
      const selected = sample(pool, Math.min(10, pool.length));
      return selected.map(k => {
        const choices = uniqueChoices(k.meaning, pool.map(x => x.meaning), 4);
        return {
          q: `Nghĩa của "${k.word}" là gì?`,
          choices,
          answer: choices.indexOf(k.meaning),
          explain: `Cách đọc: ${k.reading}`
        };
      });
    }

      const wrap = document.getElementById(containerId);
      wrap.innerHTML = `

        ${questions.map((q,qi)=>`

            ${q.choices.map((choice,ci)=>`
              <label class="choice">

                <span class="jp">${choice}</span>
              </label>
            `).join("")}
          </div>
        `).join("")}
        <div id="${containerId}-result"></div>
      `;

      document.getElementById(`${containerId}-submit`).onclick = () => {
        let score = 0;
        const review = [];
        questions.forEach((q,qi)=>{
          const chosen = document.querySelector(`input[name="${containerId}-q${qi}"]:checked`);
          const val = chosen ? Number(chosen.value) : -1;
          if(val === q.answer) score++;
          review.push(`
            <div class="q-block">
              <div><strong>Câu ${qi+1}:</strong> ${val === q.answer ? `<span class="ok">Đúng</span>` : `<span class="danger-text">Sai</span>`}</div>

              <div class="tiny">${q.explain || ""}</div>
            </div>
          `);
        });
        saveScore(scoreKey, score, questions.length);
        const pct = Math.round((score / questions.length) * 100);
        document.getElementById(`${containerId}-result`).innerHTML = `
          <div class="score-box ${pct < 60 ? 'bad' : ''}">
            <strong>Kết quả: ${score}/${questions.length} (${pct}%)</strong>
            <div class="tiny" style="margin-top:6px">

          </div>
          <div style="margin-top:12px">${review.join("")}</div>
        `;
      };
    }

    function renderSpeaking(){
      setActiveNav("speaking");
      const main = document.getElementById("main");
      main.innerHTML = `
        <div class="page">
          <section class="card">

              <div>

          <section class="grid-2">

                  <div class="speaking-box">

                    <div class="jp" style="font-size:19px;font-weight:800">${p.q}</div>
                    <div class="muted" style="margin-top:8px">Gợi ý trả lời</div>
                    <div class="jp">${p.a}</div>

                `).join("")}
              </div>
            `).join("")}
          </section>

          <section class="card">

            ${LESSONS.map(lesson=>`

          <section class="card">

            <div class="note">
              ① Trả lời đúng mẫu câu hỏi<br>
              ② Phát âm rõ trợ từ は / が / を / に<br>
              ③ Thêm 1 ý nhỏ bằng そして / でも / から<br>
              ④ Nếu nghe chưa rõ, xin hỏi lại ngay thay vì im lâu
            </div>
          </section>
        </div>
      `;
    }

    function makeExamSet(){
      const vocabQ = [];
      const grammarQ = [];
      const kanjiQ = [];

      LESSONS.forEach(lesson=>{
        sample(lesson.vocab, 3).forEach(item=>{
          const meaningPool = LESSONS.flatMap(x=>x.vocab.map(v=>v.vi));
          const choices = uniqueChoices(item.vi, meaningPool, 4);
          vocabQ.push({
            q:`Nghĩa của "${item.jp}" là gì?`,
            choices,
            answer: choices.indexOf(item.vi),
            explain: item.reading ? `Cách đọc: ${item.reading}` : ""
          });
        });

        const g = sample((GRAMMAR_BANK[lesson.id] || []), 2);
        g.forEach(([q, choices, answer, explain])=>{
          grammarQ.push({q, choices, answer, explain});
        });

        sample(lesson.kanji, 1).forEach(k=>{
          const choices = uniqueChoices(k.meaning, LESSONS.flatMap(x=>x.kanji.map(y=>y.meaning)), 4);
          kanjiQ.push({
            q:`Nghĩa của "${k.word}" là gì?`,
            choices,
            answer: choices.indexOf(k.meaning),
            explain:`Cách đọc: ${k.reading}`
          });
        });
      });

      return [...sample(vocabQ, 10), ...sample(grammarQ, 8), ...sample(kanjiQ, 7)];
    }

    let currentExam = null;
    let examTimer = null;
    let examTimeLeft = 20 * 60;

    function renderExamHome(){
      setActiveNav("exam");
      const main = document.getElementById("main");
      main.innerHTML = `
        <div class="page">
          <section class="card">
            <div class="lesson-head">
              <div>
                <div class="tag">Mock test</div>
                <h2>Tự test tổng hợp toàn bộ 7 bài</h2>
                <p class="muted">Mock gồm câu hỏi trộn vocab + grammar + kanji. Làm xong thì qua speaking hub thêm 10 phút.</p>
              </div>
              <div class="mini-stat">
                <div class="tiny">Thời gian gợi ý</div>
                <strong>20 phút</strong>
                <div class="tiny">sau đó 10 phút speaking</div>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn" id="startExamBtn">Bắt đầu mock</button>
            </div>
          </section>

          <section class="card">
            <div class="section-head"><h3>Ngưỡng đánh giá</h3></div>
            <div class="grid-3">
              <div class="mini-stat"><strong class="ok">80%+</strong><div class="tiny">đủ tốt để nhắm 8+ toàn môn</div></div>
              <div class="mini-stat"><strong class="warn-text">65-79%</strong><div class="tiny">ổn nhưng còn lỗ hổng</div></div>
              <div class="mini-stat"><strong class="danger-text">&lt;65%</strong><div class="tiny">cần quay lại bài yếu</div></div>
            </div>
          </section>
        </div>
      `;
      document.getElementById("startExamBtn").onclick = startExam;
    }

    function startExam(){
      currentExam = makeExamSet();
      examTimeLeft = 20 * 60;
      clearInterval(examTimer);

      const main = document.getElementById("main");
      main.innerHTML = `
        <div class="page">
          <section class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
            <div>
              <div class="tag">Đang làm mock</div>
              <h2 style="margin-top:8px">Mock tổng hợp 25 câu</h2>
            </div>
            <div class="timer" id="examTimer">20:00</div>
          </section>

          <section class="card">
            <div id="examWrap">
              ${currentExam.map((q,qi)=>`
                <div class="q-block">
                  <div><strong>Câu ${qi+1}.</strong> ${q.q}</div>
                  ${q.choices.map((choice,ci)=>`
                    <label class="choice">
                      <input type="radio" name="exam-q${qi}" value="${ci}">
                      <span class="jp">${choice}</span>
                    </label>
                  `).join("")}
                </div>
              `).join("")}
            </div>
            <div class="btn-row">
              <button class="btn warn" id="submitExamBtn">Nộp mock</button>
              <button class="btn secondary" id="cancelExamBtn">Hủy mock</button>
            </div>
            <div id="examResult"></div>
          </section>
        </div>
      `;

      examTimer = setInterval(()=>{
        examTimeLeft--;
        const el = document.getElementById("examTimer");
        if(el){
          const m = String(Math.floor(examTimeLeft/60)).padStart(2,"0");
          const s = String(examTimeLeft%60).padStart(2,"0");
          el.textContent = `${m}:${s}`;
        }
        if(examTimeLeft <= 0){
          clearInterval(examTimer);
          submitExam();
        }
      },1000);

      document.getElementById("submitExamBtn").onclick = submitExam;
      document.getElementById("cancelExamBtn").onclick = ()=>{
        clearInterval(examTimer);
        renderExamHome();
      };
    }

    function submitExam(){
      clearInterval(examTimer);
      if(!currentExam) return;
      let score = 0;
      currentExam.forEach((q,qi)=>{
        const chosen = document.querySelector(`input[name="exam-q${qi}"]:checked`);
        if(chosen && Number(chosen.value) === q.answer) score++;
      });
      const pct = Math.round((score / currentExam.length) * 100);
      saveScore("mock-all", score, currentExam.length);

      document.getElementById("examResult").innerHTML = `
        <div class="score-box ${pct < 60 ? 'bad' : ''}">
          <strong>Kết quả mock: ${score}/${currentExam.length} (${pct}%)</strong>
          <div class="tiny" style="margin-top:6px">
            ${pct >= 80 ? "Rất ổn. Qua Speaking hub thêm 10 phút." :
              pct >= 65 ? "Bạn đang ở vùng có thể kéo lên 8+. Xem lại bài sai nhiều nhất." :
              "Cần quay lại các bài yếu rồi làm lại mock."}
          </div>
        </div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" id="retryExamBtn">Làm mock mới</button>
          <button class="btn secondary" id="toSpeakingBtn">Qua Speaking hub</button>
        </div>
      `;
      document.getElementById("retryExamBtn").onclick = startExam;
      document.getElementById("toSpeakingBtn").onclick = renderSpeaking;
    }

    document.getElementById("resetProgressBtn").onclick = ()=>{
      if(confirm("Reset toàn bộ tiến độ và điểm quiz?")){
        localStorage.removeItem("jpd123_local_full");
        location.reload();
      }
    };

    initNav();
    renderProgress();
    renderHome();
  </script>
