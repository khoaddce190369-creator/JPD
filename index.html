<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>JPD123 - 30 ngày 8+ toàn môn &amp; 8.5+ speaking</title>
  <meta name="description" content="Web học tiếng Nhật JPD123 - 7 bài học theo lộ trình 30 ngày, mục tiêu 8+ toàn môn và 8.5+ speaking. Có quiz vocab, grammar, kanji và mock test tổng hợp." />

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- Toast container -->
  <div id="toastContainer"></div>

  <div class="app">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">
          <div class="brand-badge">日</div>
          <div>
            <div class="brand-name">JPD123</div>
          </div>
        </div>
        <button class="sidebar-mobile-close" id="sidebarMobileClose" aria-label="Đóng menu" title="Đóng menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="section-title">Menu</div>
      <button class="nav-btn" data-view="home">Tổng quan</button>
      <button class="nav-btn" data-view="roadmap">Lộ trình</button>
      <button class="nav-btn" data-view="speaking">Speaking hub</button>
      <button class="nav-btn" data-view="exam">Mock test</button>
      <button class="nav-btn" data-view="practice">Hub luyện tập</button>

      <div class="section-title">7 bài</div>
      <div id="lessonNav"></div>

      <div class="progress-box" style="margin-top:auto">
        <div class="hint-text" style="margin-bottom:6px">Tiến độ cá nhân</div>
        <div class="progress-bar"><div id="progressFill"></div></div>
        <div id="progressText" class="hint-text" style="margin-top:6px">0%</div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn btn-danger" id="resetProgressBtn" style="width:100%;justify-content:center">Reset tiến độ</button>
        </div>
      </div>
    </aside>

    <!-- Sidebar backdrop for mobile -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ===== MAIN ===== -->
    <div class="main-wrapper" style="position: relative;">
      
      <!-- Edge toggle button -->
      <button class="sidebar-edge-toggle" id="sidebarEdgeToggle" title="Ẩn/hiện menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Site header -->
      <header class="site-header">
        <div class="header-inner">
          <div class="header-left">
            <button class="sidebar-toggle" id="sidebarToggle" title="Ẩn/hiện menu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <div>
              <h1 class="header-title">JPD123 Study Hub</h1>
            </div>
          </div>
          <div class="header-stats">
            <div class="hdr-stat">
              <div class="hdr-stat-num" id="hdr-lesson-done">0/7</div>
              <div class="hdr-stat-label">Bài xong</div>
            </div>
            <div class="hdr-stat">
              <div class="hdr-stat-num" id="hdr-percent">0%</div>
              <div class="hdr-stat-label">Tiến độ</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic content -->
      <main id="main"></main>
    </div>
  </div>

  <!-- ===== Scripts (load order matters: data → state → quiz → audio → views → practice → main) ===== -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/quiz.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/practice.js"></script>
  <script src="assets/js/flashcard.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>
